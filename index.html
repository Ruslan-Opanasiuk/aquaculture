<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Заголовка, опису й canonical тут немає навмисно. Для кожного маршруту
       їх дописує scripts/prerender.js під час збірки (краулери соцмереж не
       виконують JS), а в браузері ставить components/SEO через
       react-helmet-async. Якщо продублювати їх ще й тут, у head буде по два
       однойменні теги — Helmet не замінює чужі, а додає свої поруч. -->
  <meta name="theme-color" content="#FEFAF3" />

  <link 
    rel="preload" 
    href="/fonts/montserrat-v25-latin_cyrillic-600.woff2" 
    as="font" 
    type="font/woff2" 
    crossorigin="anonymous"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Встановлюємо фон body одразу, щоб уникнути спалаху білого */
    body {
      background-color: #FDFBF7; /* твоя змінна brand-beige */
      margin: 0;
      overflow-x: hidden;
    }
    /* Простий скелетон для #root поки вантажиться React */
    #root:empty {
      background-color: #FDFBF7;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
